name: n8n-ai-clarification-workflow
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/London
      GENERIC_TIMEZONE: Europe/London
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files/evaluation
    volumes:
      - n8n_data:/home/node/.n8n
      - ./evaluation:/files/evaluation:ro
volumes:
  n8n_data:
